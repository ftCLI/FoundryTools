[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[project]
name = "foundrytools"
version = "0.1.8"
description = "A library for working with fonts in Python."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Cesare Gilento", email = "ftcli@proton.me" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Text Processing :: Fonts",
    "Typing :: Typed",
]
dependencies = [
    "afdko==4.0.3",
    "cffsubr>=0.4.0",
    "defcon>=0.12.2",
    "dehinter>=4.0.0",
    "fonttools[woff,pathops,unicode]>=4.65.0",
    "ttfautohint-py>=0.6.1",
    "ufo-extractor>=0.8.1",
    "ufo2ft>=3.9.0",
]

[project.urls]
Homepage = "https://github.com/ftCLI/FoundryTools"
Documentation = "https://foundrytools.readthedocs.io/en/latest/"
Repository = "https://github.com/ftCLI/FoundryTools"
Issues = "https://github.com/ftCLI/FoundryTools/issues"
Changelog = "https://github.com/ftCLI/FoundryTools/releases"

[dependency-groups]
dev = [
    "bump-my-version==1.6.7",
    "mypy==2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
security = [
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
]
docs = [
    "sphinx==8.2.3; python_version < '3.12'",
    "sphinx==9.1.0; python_version >= '3.12'",
    "sphinx-rtd-theme==3.1.0",
]

[tool.bumpversion]
current_version = "0.1.8"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
ignore_missing_files = false
tag = true
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
commit = true
message = "Bump version: {current_version} → {new_version}"
commit_args = ""
setup_hooks = []
pre_commit_hooks = []
post_commit_hooks = []

[[tool.bumpversion.files]]
filename = "pyproject.toml"

[[tool.bumpversion.files]]
filename = "src/foundrytools/__init__.py"

[[tool.bumpversion.files]]
filename = "docs/conf.py"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
]

[tool.mypy]
warn_unused_configs = true
disallow_untyped_defs = true
exclude = '\.venv'

[[tool.mypy.overrides]]
module = [
    "fontTools.*",
    "afdko.*",
    "cffsubr.*",
    "defcon.*",
    "dehinter.*",
    "extractor.*",
    "pathops.*",
    "ttfautohint.*",
    "ufo2ft.*",
]
ignore_missing_imports = true
